<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: linear-gradient(135deg, #0d0a1a 0%, #160d2e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(108,71,254,0.12) 0%, transparent 65%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .logo {
      width: 160px;
      height: 160px;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }
    .wordmark {
      font-size: 72px;
      font-weight: 800;
      color: white;
      letter-spacing: -1px;
      position: relative;
      z-index: 1;
    }
    .tagline {
      font-size: 30px;
      font-weight: 400;
      color: rgba(167, 139, 250, 0.85);
      margin-top: 14px;
      letter-spacing: 0.5px;
      position: relative;
      z-index: 1;
    }
    .subtitle {
      font-size: 22px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.35);
      margin-top: 10px;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <img class="logo" src="/logo-icon.svg" alt="SkillSnap" />
  <div class="wordmark">SkillSnap</div>
  <div class="tagline">Watch. Trust. Connect.</div>
  <div class="subtitle">Sydney's skills &amp; trades platform</div>
</body>
</html>
